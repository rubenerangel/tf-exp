name: terraform-plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:                                                 # 👈 NUEVO CI-5
  group: plan-pr-${{ github.event.pull_request.number }}     # 👈 NUEVO CI-5: una cola por PR
  cancel-in-progress: true                                   # 👈 NUEVO CI-5: un push nuevo cancela el plan viejo

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Ver claims del token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            console.log(JSON.stringify({ sub: c.sub, aud: c.aud, event: c.event_name }, null, 2));

      - name: Autenticar en AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEV }}
          aws-region: us-east-1

      - name: Formato
        run: terraform fmt -check

      - name: Init (backend de dev)
        run: terraform init -input=false -backend-config=dev.s3.tfbackend

      - name: Validar
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=3m -out=tfplan   # 👈 NUEVO CI-5: -lock-timeout=3m
          terraform show -no-color tfplan > plan.txt

      - name: Comentar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n... (plan truncado)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (dev)\n```\n' + plan + '\n```'
            });